# Own workspace: the repo root Cargo.toml is the on-chain workspace and must not pick this up
# (same rule as frontend/companion). This crate never enters the SBF build.
[workspace]

[package]
name = "alashi-rules-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
alashi-rules = { path = "../rules" }
wasm-bindgen = "0.2"

[profile.release]
opt-level = "z"
lto = true
