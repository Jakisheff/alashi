[workspace]
members = [
    "rules",
    "programs/*",
    "vendor/solana-secp256k1-recover"
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# Host-only LiteSVM dependency: use patched RustCrypto without changing the syscall.
[patch.crates-io]
solana-secp256k1-recover = { path = "vendor/solana-secp256k1-recover" }
