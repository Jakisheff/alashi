# fly.io config: alashi arena
# деплой: fly deploy (из корня репо)
app = "alashi-arena"
primary_region = "fra"

[build]

[env]
ALASHI_SEQ_FILE = "/data/arena_party_no.txt"
ALASHI_STATE_FILE = "/data/arena_state.json"
# D1 (ADR-001): атомарное SQLite WAL-хранилище вместо пары плоских файлов.
# При первом старте данные из arena_state.json + arena_party_no.txt
# мигрируются в arena.db одной транзакцией.
ALASHI_DB_FILE = "/data/arena.db"

[[mounts]]
source = "alashi_data"
destination = "/data"

[http_service]
internal_port = 8090
force_https = true
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1

[[vm]]
size = "shared-cpu-1x"
memory = "256mb"
