[package]
name = "arena"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
alashi-rules = { path = "../rules" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
borsh = "1"
solana-signature = { version = "=3.5.2", features = ["verify"] }

[dev-dependencies]
solana-ed25519 = "=0.2.4"
