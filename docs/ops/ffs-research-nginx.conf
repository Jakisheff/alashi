    # FFS research routes only. Insert these three locations inside the existing
    # alashi.network TLS server, alongside the strategy/comparison locations.
    # Place before any broader regex location that could match these paths.
    # Existing http-level alashi_profile/alashi_act limit_req zones are required.
    # Keep owner authentication and existing routes unchanged. Do not include this
    # file at http level or add a general /agents/owner/research catch-all proxy.
    # Check the full resulting nginx configuration with nginx -t before reload.
    # This file alone is a server-context fragment, not a standalone nginx config.

    location = /research-library {
        if ($request_method != GET) { return 405; }
        # request_uri also catches a bare trailing question mark.
        if ($request_uri ~ "[?]") { return 400; }
        limit_req zone=alashi_profile burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    location ~ "^/agents/[0-9a-f]{64}/owner/research$" {
        if ($request_method != GET) { return 405; }
        if ($request_uri ~ "[?]") { return 400; }
        limit_req zone=alashi_act burst=32 nodelay;
        limit_req_status 429;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:8095;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_send_timeout 5s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Origin $http_origin;
        proxy_set_header Cookie $http_cookie;
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    # Only the nine actions implemented by arena/src/strategy_research.rs.
    location ~ "^/agents/[0-9a-f]{64}/owner/research/(backlog-upsert|round-open|forecast|round-close|digest-ack|apply|publish|publish-local|library-reuse)$" {
        if ($request_method != POST) { return 405; }
        if ($request_uri ~ "[?]") { return 400; }
        if ($content_type !~* "^application/json(;|$)") { return 415; }
        client_max_body_size 256k;
        client_body_buffer_size 256k;
        client_body_timeout 5s;
        limit_req zone=alashi_act burst=32 nodelay;
        limit_req_status 429;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:8095;
        proxy_connect_timeout 2s;
        proxy_read_timeout 110s;
        proxy_send_timeout 5s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Origin $http_origin;
        proxy_set_header Cookie $http_cookie;
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
