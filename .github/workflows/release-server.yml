name: Build server release

on:
  workflow_dispatch:
  push:
    tags: ['server-v*']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/server-release
      CARGO_BUILD_JOBS: '2'
      RELEASE_ID: server-${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: '. -> target/server-release'
          shared-key: server-release-linux-x86_64
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build Linux x86_64 binaries with the pinned Rust toolchain
        run: |
          cargo build --release --locked --manifest-path arena/Cargo.toml --bin arenad
          cargo build --release --locked --manifest-path indexer/Cargo.toml --bin chain_api
          cargo build --release --locked --manifest-path bots/Cargo.toml --bin bots
      - name: Build frontend for immutable release assets
        env:
          BASE: /releases/${{ env.RELEASE_ID }}/
          VITE_LIVE_API_ENABLED: 'true'
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
      - name: Package binaries, frontend and checksums
        run: |
          mkdir -p "package/$RELEASE_ID/bin" dist
          install -m 0755 "$CARGO_TARGET_DIR/release/arenad" "$CARGO_TARGET_DIR/release/chain_api" "$CARGO_TARGET_DIR/release/bots" "package/$RELEASE_ID/bin/"
          cp -a frontend/dist "package/$RELEASE_ID/frontend"
          {
            printf 'commit=%s\narchitecture=linux-x86_64\nrelease=%s\n' "$GITHUB_SHA" "$RELEASE_ID"
            rustc --version
            node --version
          } > "package/$RELEASE_ID/BUILD.txt"
          (
            cd "package/$RELEASE_ID"
            find bin frontend -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum BUILD.txt >> SHA256SUMS
          )
          tar -C package -czf "dist/alashi-$RELEASE_ID-linux-x86_64.tar.gz" "$RELEASE_ID"
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
      - name: Verify the extracted archive
        run: |
          mkdir verify
          tar -C verify -xzf "dist/alashi-$RELEASE_ID-linux-x86_64.tar.gz"
          cd "verify/$RELEASE_ID"
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alashi-server-linux-x86_64-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
