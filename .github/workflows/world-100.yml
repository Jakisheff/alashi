name: Experimental 100-agent world

on:
  pull_request:
    paths:
      - 'rules/**'
      - 'arena/**'
      - 'tools/agent-bootstrap/world-run*'
      - '.github/workflows/world-100.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-worker:
    name: Canonical world worker and portable macOS binary
    runs-on: macos-15
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target
            arena -> target
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.18.0'
      - run: npm ci --ignore-scripts --prefix tools/agent-bootstrap
      - name: Preserve ordinary rules and test experimental admission
        run: cargo test --locked -p alashi-rules
      - name: Test worker protocol and canonical 100-player settlement
        run: cargo test --locked --manifest-path arena/Cargo.toml --bin world_worker
      - name: Build portable worker
        run: cargo build --locked --manifest-path arena/Cargo.toml --bin world_worker
      - name: Test driver and recovery without external model calls
        run: WORLD_WORKER="$GITHUB_WORKSPACE/arena/target/debug/world_worker" node --test tools/agent-bootstrap/world-run.test.mjs
      - name: Package binary with provenance
        run: |
          mkdir world-worker-package
          cp arena/target/debug/world_worker world-worker-package/
          git rev-parse HEAD > world-worker-package/commit.txt
          rustc --version > world-worker-package/toolchain.txt
          uname -sm >> world-worker-package/toolchain.txt
          cd world-worker-package
          shasum -a 256 world_worker > SHA256SUMS
          cd ..
          tar -czf world-worker-macos-arm64.tar.gz -C world-worker-package .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: world-worker-macos-arm64
          path: world-worker-macos-arm64.tar.gz
          retention-days: 7
          if-no-files-found: error
