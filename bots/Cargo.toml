[package]
name = "bots"
version = "0.1.0"
edition = "2021"
rust-version = "1.89.0"

[workspace]

[dependencies]
# solana-keypair 3.1 requires DecodeError to implement std::error::Error.
five8 = { version = "0.2.1", features = ["std"] }
alashi = { path = "../programs/alashi" }
anchor-lang = "1.1.2"
serde_json = "1.0"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
solana-commitment-config = "3.0"
solana-rpc-client-api = "3.1"
solana-signature = "3"
solana-transaction-status-client-types = "3.1"
solana-sysvar = "3.1"
solana-keypair = "3.0.1"
solana-message = "3.0.1"
solana-rpc-client = "3.0.1"
solana-signer = "3.0.0"
solana-transaction = "3.0.2"
switchboard-on-demand = "0.13.0"

[patch.crates-io]
solana-account-decoder = { path = "../vendor/solana-account-decoder" }
solana-account-decoder-client-types = { path = "../vendor/solana-account-decoder-client-types" }
