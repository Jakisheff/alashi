<!doctype html><meta charset="utf-8"><title>Alashi frame budget control</title><style>body{background:#18121f;color:#ddd;font:20px system-ui}canvas{width:640px;height:360px}</style><h1>Контроль частоты кадров без сцены</h1><canvas id="test" width="640" height="360"></canvas><output id="stats"></output><script>const c=document.getElementById('test').getContext('2d'),out=document.getElementById('stats');let start=performance.now(),last=start,n=0,frames=[];function tick(t){const dt=t-last;last=t;frames.push(dt);if(frames.length>600)frames.shift();c.fillStyle='#18121f';c.fillRect(0,0,640,360);c.fillStyle='#c3a0ff';c.fillRect((t/3)%600,160,40,40);n++;if(t-start>1000){out.textContent=JSON.stringify({fps:n*1000/(t-start),visibility:document.visibilityState,meanFrameMs:frames.reduce((a,b)=>a+b,0)/frames.length});start=t;n=0;}requestAnimationFrame(tick)}requestAnimationFrame(tick)</script>
